[project]
name = "fastapi-study"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SunJiahao66688", email = "sunjiahao66688@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
fastapi-study = "fastapi_study:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://mirror.nju.edu.cn/pypi/web/simple"
default = true

[tool.uv]
override-dependencies = [
    "pydantic==2.14.0",
    "pydantic-core==2.50.0",
]
